name: Docker tests

# Integration tests that build and run the fixture app in containers, and drive a real Chromium.
# Slower than CI, so they run only when code that affects them changes.
on:
  push:
    branches: [main]
    paths: &paths
      - packages/core/**
      - packages/cli/**
      - fixtures/**
      - e2e/**
      - pnpm-lock.yaml
      - vitest.docker.config.ts
      - .github/workflows/docker.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm browser:install --with-deps

      - run: docker pull --quiet node:22

      - run: pnpm test:docker
