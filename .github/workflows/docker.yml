name: Docker tests

# Integration tests that build and run the fixture app in containers and drive a real Chromium,
# and the end-to-end suite (`bdiff run` on every fixture branch), as two parallel jobs. Slower than
# CI, so they run only when code that affects them changes.
on:
  push:
    branches: [main]
    paths: &paths
      - packages/core/**
      - packages/cli/**
      - packages/report/**
      - packages/panel/**
      - fixtures/**
      - e2e/**
      - pnpm-lock.yaml
      - vitest.docker.config.ts
      - .github/workflows/docker.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: integration
            name: docker integration tests
          - project: e2e
            name: e2e on the fixture
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm browser:install --with-deps

      # Ubuntu 23.10+ restricts unprivileged user namespaces with AppArmor, which Chromium's
      # sandbox needs. bdiff never turns the sandbox off, so allow them on this throwaway runner.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Docker Hub limits anonymous pulls per IP, which shared runners hit; pull through Google's
      # public Docker Hub mirror instead (also for the images compose pulls during runs).
      - name: Use the mirror.gcr.io Docker Hub mirror
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$config" > /dev/null
          sudo systemctl restart docker

      - run: docker pull --quiet node:22

      # The e2e suite logs each branch's wall time ("e2e wall time …") to track its speed.
      - run: pnpm test:docker --project ${{ matrix.project }}
